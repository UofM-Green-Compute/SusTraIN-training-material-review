name: Update Content Manifest

on:
  push:
    paths:
      - "training_materials/*/*.yml"
      - "training_materials/*/*.yaml"
      - "page_rendering_code/assets/bios/**/*"
      - "!page_rendering_code/assets/bios/bios-manifest.json"
      - "page_rendering_code/scripts/generate-manifest.mjs"
      - "page_rendering_code/scripts/generate-frontmatter.mjs"
      - "page_rendering_code/scripts/generate-bios-manifest.mjs"
      - ".github/workflows/update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install
        working-directory: page_rendering_code

      - name: Regenerate content manifest
        run: node page_rendering_code/scripts/generate-manifest.mjs

      - name: Regenerate content frontmatter
        run: node page_rendering_code/scripts/generate-frontmatter.mjs

      - name: Regenerate team bios manifest
        run: node page_rendering_code/scripts/generate-bios-manifest.mjs

      - name: Commit and push metadata if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training_materials/content-manifest.yml
          git add training_materials/content-frontmatter.json
          git add page_rendering_code/assets/bios/bios-manifest.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update content metadata"
          git push origin HEAD:${{ github.ref_name }}
